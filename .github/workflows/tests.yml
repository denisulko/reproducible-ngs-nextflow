name: CI - Nextflow DSL2 & MultiQC Telemetry Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib seaborn

      - name: Run unit tests and end-to-end telemetry verification
        run: |
          python -m unittest discover -s tests -v
          python scripts/simulate_nextflow_cohort.py
          python scripts/run_multiqc_aggregator.py
          python scripts/plot_workflow_telemetry.py
